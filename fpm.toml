name = "bspline-fortran"
version = "7.4.0"
author = "Jacob Williams"
maintainer = "Jacob Williams"
copyright = "Copyright (c) 2015-2024, Jacob Williams"
license = "BSD"
description = "Multidimensional B-Spline Interpolation of Data on a Regular Grid"
homepage = "https://github.com/jacobwilliams/bspline-fortran"

[build]
auto-executables = false
auto-examples = false
auto-tests = true

[dev-dependencies]
pyplot-fortran = { git = "https://github.com/jacobwilliams/pyplot-fortran", tag = "3.3.0" }
finterp = { git = "https://github.com/jacobwilliams/finterp", tag = "1.3.0" }
polyroots-fortran = { git = "https://github.com/jacobwilliams/polyroots-fortran", tag = "1.4.0" }

[library]
source-dir = "src"

# Have fpm pass the compiler's preprocessor flag explicitly for .F90 files.
# Compilers normally preprocess .F90 based on the upper-case extension, but
# that doesn't work on case-insensitive file systems (e.g., ifx on Windows).
[preprocess]
[preprocess.cpp]
suffixes = ["F90"]

[install]
library = true

[extra.fortitude.check]
ignore = [
  "C003",  # implicit none(external)
  "C061",  # missing intent attribute
  "C121",  # use without explicit only
  "S241",  # allow single quotes
  "C071",  # allow assumed size
]
line-length = 132